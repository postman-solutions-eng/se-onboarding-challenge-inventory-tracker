apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

images:
  - name: inventory-tracker-backend
    newTag: local

patches:
  - target:
      kind: Deployment
      name: inventory-tracker-backend
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: Service
      name: inventory-tracker-backend
    patch: |-
      - op: replace
        path: /spec/type
        value: LoadBalancer
