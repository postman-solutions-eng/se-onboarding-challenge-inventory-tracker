$kind: http-request
description: 'Verifies that a request with a wrong x-api-key value is rejected with 401 Unauthorized. Uses x-mock-response-code header to simulate the invalid key scenario.'
url: '{{baseUrl}}/items'
method: GET
headers:
  - key: Accept
    value: application/json
  - key: x-api-key
    value: invalid-key-000
  - key: x-mock-response-code
    value: '401'
order: 2000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 401 when API key is invalid', () => {
          pm.response.to.have.status(401);
      });
      pm.test('Content-Type is application/json', () => {
          pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json');
      });
      pm.test('Response time is under 1000ms', () => {
          pm.expect(pm.response.responseTime).to.be.below(1000);
      });
      pm.test('Error body matches schema', () => {
          pm.response.to.have.jsonSchema({
              type: 'object',
              required: ['code', 'message', 'details'],
              properties: {
                  code: { type: 'string' },
                  message: { type: 'string' },
                  details: { type: 'array' }
              }
          });
      });
      pm.test('Error code is UNAUTHORIZED', () => {
          pm.expect(pm.response.json().code).to.equal('UNAUTHORIZED');
      });
settings: {}
