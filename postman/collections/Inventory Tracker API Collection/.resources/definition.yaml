$kind: collection
auth:
  type: apikey
  credentials:
    key: X-API-Key
    value: "{{apiKey}}"
    in: header
variables:
  sku: ""
  locationCode: ""
  itemId: ""
  locationId: ""
scripts:
  - type: http:beforeRequest
    code: |-
      // Generate unique SKU and location code before every request.
      // Because {{sku}} is only consumed by POST /items and {{locationCode}} only by
      // POST /locations, regenerating on each pre-request is safe and guarantees
      // re-run safety (no 409 Conflict on repeat runs).
      const ts = Date.now();
      pm.collectionVariables.set('sku', 'WIDGET-' + ts);
      pm.collectionVariables.set('locationCode', 'WH-' + ts);
    language: text/javascript
