$kind: http-request
name: '409 – Duplicate SKU'
order: 3000
url: '{{baseUrl}}/items'
method: POST
headers:
  'x-api-key': '{{apiKey}}'
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "sku": "PLACEHOLDER",
      "name": "Duplicate Item",
      "unit": "each"
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      // Create a temp item first, then update this request to use the same SKU (triggers 409)
      const failSku = 'FAIL-SKU-' + Date.now();
      pm.sendRequest({
          url: pm.environment.get('baseUrl') + '/items',
          method: 'POST',
          header: {
              'x-api-key': pm.environment.get('apiKey'),
              'Content-Type': 'application/json'
          },
          body: {
              mode: 'raw',
              raw: JSON.stringify({ sku: failSku, name: 'Temp Dup Item', unit: 'each' })
          }
      }, (err, res) => {
          if (err || res.code !== 201) {
              console.error('409 dup-SKU setup failed: ' + (err ? err.message : res.text()));
              return;
          }
          pm.request.body.update({
              mode: 'raw',
              raw: JSON.stringify({ sku: failSku, name: 'Duplicate Item', unit: 'each' })
          });
      });
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 409', () => {
          pm.response.to.have.status(409);
      });
      pm.test('Content-Type is application/json', () => {
          pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json');
      });
      pm.test('Response time is under 1000ms', () => {
          pm.expect(pm.response.responseTime).to.be.below(1000);
      });
      pm.test('Response body matches Error schema', () => {
          pm.response.to.have.jsonSchema({
              type: 'object',
              required: ['code', 'message'],
              properties: {
                  code: { type: 'string' },
                  message: { type: 'string' },
                  details: {}
              }
          });
      });
settings: {}
