$kind: http-request
description: Creates a new warehouse or bin location. The location code must be unique.
url: "{{baseUrl}}/locations"
method: POST
headers:
  'x-api-key': '{{apiKey}}'
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "code": "{{locationCode}}",
      "name": "East Warehouse"
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "code": {
          "type": "string",
          "pattern": "^[A-Z0-9][A-Z0-9\\-]{1,19}$",
          "example": "WH-EAST",
          "description": "Short unique location code (uppercase alphanumeric with hyphens, e.g. WH-EAST, BIN-A01)"
        },
        "name": {
          "type": "string",
          "minLength": 1,
          "maxLength": 200,
          "example": "East Warehouse",
          "description": "Human-readable location name"
        },
        "description": {
          "type": "string",
          "example": "Main receiving warehouse on the east side of the campus",
          "description": "Optional address or notes about the location"
        }
      },
      "required": [
        "code",
        "name"
      ]
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 201', () => {
          pm.response.to.have.status(201);
      });
      pm.test('Content-Type is application/json', () => {
          pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json');
      });
      pm.test('Response time is under 1000ms', () => {
          pm.expect(pm.response.responseTime).to.be.below(1000);
      });
      pm.test('Response body matches Location schema', () => {
          pm.response.to.have.jsonSchema({
              type: 'object',
              required: ['id', 'code', 'name'],
              properties: {
                  id: { type: 'string' },
                  code: { type: 'string' },
                  name: { type: 'string' },
                  createdAt: { type: 'string' }
              }
          });
      });
      if (pm.response.code === 201) {
          pm.collectionVariables.set('locationId', pm.response.json().id);
      }
settings: {}
examples: ./.resources/Create a new location.resources/examples
order: 2000
