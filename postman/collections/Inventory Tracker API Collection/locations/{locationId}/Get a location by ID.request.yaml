$kind: http-request
description: Returns full details for a single location.
url: "{{baseUrl}}/locations/:locationId"
method: GET
headers:
  'x-api-key': '{{apiKey}}'
  Accept: application/json
pathVariables:
  - key: locationId
    value: '{{locationId}}'
    disabled: false
    description: Unique identifier of the location (UUID)
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "format": "uuid"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: text
  content: ""
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 200', () => {
          pm.response.to.have.status(200);
      });
      pm.test('Content-Type is application/json', () => {
          pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json');
      });
      pm.test('Response time is under 1000ms', () => {
          pm.expect(pm.response.responseTime).to.be.below(1000);
      });
      pm.test('Response body matches Location schema', () => {
          pm.response.to.have.jsonSchema({
              type: 'object',
              required: ['id', 'code', 'name'],
              properties: {
                  id: { type: 'string' },
                  code: { type: 'string' },
                  name: { type: 'string' },
                  description: { type: 'string' },
                  createdAt: { type: 'string' }
              }
          });
      });
settings: {}
examples: ./.resources/Get a location by ID.resources/examples
order: 1000
