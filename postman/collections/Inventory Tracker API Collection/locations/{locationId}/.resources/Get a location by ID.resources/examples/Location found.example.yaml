$kind: http-example
request:
  url: "{{baseUrl}}/locations/:locationId"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: locationId
      value: b2c3d4e5-f6a7-8901-bcde-f12345678901
      disabled: false
      description: Unique identifier of the location (UUID)
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": "b2c3d4e5-f6a7-8901-bcde-f12345678901",
        "code": "WH-EAST",
        "name": "East Warehouse",
        "description": "Main receiving warehouse on the east side of the campus",
        "createdAt": "2025-01-10T08:00:00Z"
      }
    $type: |-
      {
        "allOf": [
          {
            "type": "object",
            "properties": {
              "code": {
                "type": "string",
                "pattern": "^[A-Z0-9][A-Z0-9\\-]{1,19}$",
                "example": "WH-EAST",
                "description": "Short unique location code (uppercase alphanumeric with hyphens, e.g. WH-EAST, BIN-A01)"
              },
              "name": {
                "type": "string",
                "minLength": 1,
                "maxLength": 200,
                "example": "East Warehouse",
                "description": "Human-readable location name"
              },
              "description": {
                "type": "string",
                "example": "Main receiving warehouse on the east side of the campus",
                "description": "Optional address or notes about the location"
              }
            },
            "required": [
              "code",
              "name"
            ]
          },
          {
            "type": "object",
            "properties": {
              "id": {
                "type": "string",
                "example": "b2c3d4e5-f6a7-8901-bcde-f12345678901",
                "description": "Server-generated unique location identifier",
                "format": "uuid"
              },
              "createdAt": {
                "type": "string",
                "example": "2025-01-10T08:00:00Z",
                "description": "ISO 8601 timestamp when the location was created",
                "format": "date-time"
              }
            },
            "required": [
              "id",
              "createdAt"
            ]
          }
        ]
      }
order: 1000
