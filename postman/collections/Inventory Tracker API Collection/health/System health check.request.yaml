$kind: http-request
description: Returns the operational status of the service. No authentication required.
url: "{{baseUrl}}/health"
method: GET
headers:
  Accept: application/json
body:
  type: text
  content: ""
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 200', () => {
          pm.response.to.have.status(200);
      });
      pm.test('Content-Type is application/json', () => {
          pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json');
      });
      pm.test('Response time is under 1000ms', () => {
          pm.expect(pm.response.responseTime).to.be.below(1000);
      });
      pm.test('Response body matches health schema', () => {
          pm.response.to.have.jsonSchema({
              type: 'object',
              required: ['status'],
              properties: {
                  status: { type: 'string' }
              }
          });
      });
settings: {}
examples: ./.resources/System health check.resources/examples
order: 1000
