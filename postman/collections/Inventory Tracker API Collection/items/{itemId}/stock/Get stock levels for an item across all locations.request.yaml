$kind: http-request
description: Returns the current quantity of the specified item at each location where stock is held.
url: "{{baseUrl}}/items/:itemId/stock?page=1&pageSize=20"
method: GET
headers:
  'x-api-key': '{{apiKey}}'
  Accept: application/json
queryParams:
  - key: page
    value: "1"
    disabled: false
    description: Page number for pagination (1-based)
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "integer",
            "default": 1,
            "minimum": 1
          }
        }
      }
  - key: pageSize
    value: "20"
    disabled: false
    description: Number of results per page
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "integer",
            "default": 20,
            "minimum": 1,
            "maximum": 100
          }
        }
      }
pathVariables:
  - key: itemId
    value: '{{itemId}}'
    disabled: false
    description: Unique identifier of the item (UUID)
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "format": "uuid"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: text
  content: ""
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 200', () => {
          pm.response.to.have.status(200);
      });
      pm.test('Content-Type is application/json', () => {
          pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json');
      });
      pm.test('Response time is under 1000ms', () => {
          pm.expect(pm.response.responseTime).to.be.below(1000);
      });
      pm.test('Response body matches StockList schema', () => {
          pm.response.to.have.jsonSchema({
              type: 'object',
              required: ['data', 'pagination'],
              properties: {
                  data: {
                      type: 'array',
                      items: {
                          type: 'object',
                          required: ['itemId', 'locationId', 'quantity'],
                          properties: {
                              itemId: { type: 'string' },
                              locationId: { type: 'string' },
                              quantity: { type: 'number' }
                          }
                      }
                  },
                  pagination: {
                      type: 'object',
                      required: ['page', 'pageSize', 'total'],
                      properties: {
                          page: { type: 'number' },
                          pageSize: { type: 'number' },
                          total: { type: 'number' }
                      }
                  }
              }
          });
      });
      pm.test('data is an array', () => {
          pm.expect(pm.response.json().data).to.be.an('array');
      });
      pm.test('pagination has page, pageSize, total', () => {
          const p = pm.response.json().pagination;
          pm.expect(p).to.have.property('page');
          pm.expect(p).to.have.property('pageSize');
          pm.expect(p).to.have.property('total');
      });
settings: {}
examples: ./.resources/Get stock levels for an item across all locations.resources/examples
order: 1000
