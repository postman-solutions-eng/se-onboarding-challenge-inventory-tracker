$kind: http-request
description: Returns the current quantity of the specified item at each location where stock is held.
url: "{{baseUrl}}/items/:itemId/stock?page=1&pageSize=20"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: page
    value: "1"
    disabled: false
    description: Page number for pagination (1-based)
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "integer",
            "default": 1,
            "minimum": 1
          }
        }
      }
  - key: pageSize
    value: "20"
    disabled: false
    description: Number of results per page
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "integer",
            "default": 20,
            "minimum": 1,
            "maximum": 100
          }
        }
      }
pathVariables:
  - key: itemId
    value: a1b2c3d4-e5f6-7890-abcd-ef1234567890
    disabled: false
    description: Unique identifier of the item (UUID)
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "format": "uuid"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: text
  content: ""
settings: {}
examples: ./.resources/Get stock levels for an item across all locations.resources/examples
order: 1000
