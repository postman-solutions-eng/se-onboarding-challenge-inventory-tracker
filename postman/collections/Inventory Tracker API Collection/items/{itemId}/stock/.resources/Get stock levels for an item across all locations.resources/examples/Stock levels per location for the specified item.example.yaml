          }
        ],
        "pagination": {
          "page": 1,
          "pageSize": 20,
          "total": 2
        }
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "data": {
            "type": "array",
            "items": {
              "type": "object",
              "properties": {
                "itemId": {
                  "type": "string",
                  "example": "a1b2c3d4-e5f6-7890-abcd-ef1234567890",
                  "description": "ID of the item",
                  "format": "uuid"
                },
                "locationId": {
                  "type": "string",
                  "example": "b2c3d4e5-f6a7-8901-bcde-f12345678901",
