$kind: http-example
request:
  url: "{{baseUrl}}/items/:itemId/stock?page=1&pageSize=20"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    - key: page
      value: "1"
      disabled: false
      description: Page number for pagination (1-based)
    - key: pageSize
      value: "20"
      disabled: false
      description: Number of results per page
  pathVariables:
    - key: itemId
      value: a1b2c3d4-e5f6-7890-abcd-ef1234567890
      disabled: false
      description: Unique identifier of the item (UUID)
  body:
    type: text
    content: ""
