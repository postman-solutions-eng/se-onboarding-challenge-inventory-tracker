  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": [
          {
            "itemId": "a1b2c3d4-e5f6-7890-abcd-ef1234567890",
            "locationId": "b2c3d4e5-f6a7-8901-bcde-f12345678901",
            "locationCode": "WH-EAST",
            "quantity": 42,
            "updatedAt": "2025-06-01T14:30:00Z"
          },
          {
            "itemId": "a1b2c3d4-e5f6-7890-abcd-ef1234567890",
            "locationId": "e5f6a7b8-c9d0-1234-ef01-345678901234",
