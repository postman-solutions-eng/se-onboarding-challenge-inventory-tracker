$kind: http-request
description: Applies a partial update to an existing item. Only provided fields are changed.
url: "{{baseUrl}}/items/:itemId"
method: PATCH
headers:
  'x-api-key': '{{apiKey}}'
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: itemId
    value: '{{itemId}}'
    disabled: false
    description: Unique identifier of the item (UUID)
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "format": "uuid"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: json
  content: |-
    {
      "name": "Blue Widget Pro"
    }
  $type: |-
    {
      "description": "Fields that can be updated on an existing item. All properties are optional.",
      "type": "object",
      "properties": {
        "name": {
          "type": "string",
          "minLength": 1,
          "maxLength": 200,
          "example": "Blue Widget Pro"
        },
        "description": {
          "type": "string",
          "example": "Enhanced blue widget with improved durability"
        },
        "unit": {
          "type": "string",
          "minLength": 1,
          "maxLength": 50,
          "example": "each"
        },
        "reorderThreshold": {
          "type": "integer",
          "minimum": 0,
          "example": 15
        },
        "status": {
          "type": "string",
          "enum": [
            "active",
            "discontinued"
          ],
          "example": "active"
        }
      }
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 200', () => {
          pm.response.to.have.status(200);
      });
      pm.test('Content-Type is application/json', () => {
          pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json');
      });
      pm.test('Response time is under 1000ms', () => {
          pm.expect(pm.response.responseTime).to.be.below(1000);
      });
      pm.test('Response body matches Item schema', () => {
          pm.response.to.have.jsonSchema({
              type: 'object',
              required: ['id', 'sku', 'name', 'unit', 'status'],
              properties: {
                  id: { type: 'string' },
                  sku: { type: 'string' },
                  name: { type: 'string' },
                  unit: { type: 'string' },
                  status: { type: 'string' },
                  createdAt: { type: 'string' },
                  updatedAt: { type: 'string' }
              }
          });
      });
settings: {}
examples: ./.resources/Partially update an item.resources/examples
order: 2000
