$kind: http-request
description: Applies a partial update to an existing item. Only provided fields are changed.
url: "{{baseUrl}}/items/:itemId"
method: PATCH
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: itemId
    value: a1b2c3d4-e5f6-7890-abcd-ef1234567890
    disabled: false
    description: Unique identifier of the item (UUID)
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "format": "uuid"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: json
  content: |-
    {
      "name": "Blue Widget Pro"
    }
  $type: |-
    {
      "description": "Fields that can be updated on an existing item. All properties are optional.",
      "type": "object",
      "properties": {
        "name": {
          "type": "string",
          "minLength": 1,
          "maxLength": 200,
          "example": "Blue Widget Pro"
        },
        "description": {
          "type": "string",
          "example": "Enhanced blue widget with improved durability"
        },
        "unit": {
          "type": "string",
          "minLength": 1,
          "maxLength": 50,
          "example": "each"
        },
        "reorderThreshold": {
          "type": "integer",
          "minimum": 0,
          "example": 15
        },
        "status": {
          "type": "string",
          "enum": [
            "active",
            "discontinued"
          ],
          "example": "active"
        }
      }
    }
settings: {}
examples: ./.resources/Partially update an item.resources/examples
order: 2000
