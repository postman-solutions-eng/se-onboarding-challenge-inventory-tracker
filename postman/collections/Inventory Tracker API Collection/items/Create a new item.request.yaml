$kind: http-request
description: Creates a new inventory item. The SKU must be unique across all items.
url: "{{baseUrl}}/items"
method: POST
headers:
  'x-api-key': '{{apiKey}}'
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "sku": "{{sku}}",
      "name": "Blue Widget",
      "unit": "each"
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "sku": {
          "type": "string",
          "pattern": "^[A-Z0-9][A-Z0-9\\-]{2,29}$",
          "example": "WIDGET-001",
          "description": "Stock Keeping Unit — unique product code (uppercase alphanumeric with hyphens, e.g. WIDGET-001)"
        },
        "name": {
          "type": "string",
          "minLength": 1,
          "maxLength": 200,
          "example": "Blue Widget",
          "description": "Human-readable item name"
        },
        "description": {
          "type": "string",
          "example": "A high-quality blue widget for industrial use",
          "description": "Optional detailed description of the item"
        },
        "unit": {
          "type": "string",
          "minLength": 1,
          "maxLength": 50,
          "example": "each",
          "description": "Unit of measure (e.g. each, kg, liter, box)"
        },
        "reorderThreshold": {
          "type": "integer",
          "minimum": 0,
          "example": 10,
          "description": "Stock level at or below which a reorder should be triggered"
        },
        "status": {
          "type": "string",
          "enum": [
            "active",
            "discontinued"
          ],
          "example": "active",
          "description": "Lifecycle status of the item"
        }
      },
      "required": [
        "sku",
        "name",
        "unit"
      ]
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 201', () => {
          pm.response.to.have.status(201);
      });
      pm.test('Content-Type is application/json', () => {
          pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json');
      });
      pm.test('Response time is under 1000ms', () => {
          pm.expect(pm.response.responseTime).to.be.below(1000);
      });
      pm.test('Response body matches Item schema', () => {
          pm.response.to.have.jsonSchema({
              type: 'object',
              required: ['id', 'sku', 'name', 'unit', 'status'],
              properties: {
                  id: { type: 'string' },
                  sku: { type: 'string' },
                  name: { type: 'string' },
                  unit: { type: 'string' },
                  status: { type: 'string', enum: ['active', 'discontinued'] },
                  reorderThreshold: { type: 'number' },
                  createdAt: { type: 'string' },
                  updatedAt: { type: 'string' }
              }
          });
      });
      if (pm.response.code === 201) {
          pm.collectionVariables.set('itemId', pm.response.json().id);
      }
settings: {}
examples: ./.resources/Create a new item.resources/examples
order: 2000
