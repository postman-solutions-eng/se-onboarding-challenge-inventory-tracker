$kind: http-request
description: Creates a new inventory item. The SKU must be unique across all items.
url: "{{baseUrl}}/items"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "sku": "WIDGET-001",
      "name": "Blue Widget",
      "unit": "each"
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "sku": {
          "type": "string",
          "pattern": "^[A-Z0-9][A-Z0-9\\-]{2,29}$",
          "example": "WIDGET-001",
          "description": "Stock Keeping Unit — unique product code (uppercase alphanumeric with hyphens, e.g. WIDGET-001)"
        },
        "name": {
          "type": "string",
          "minLength": 1,
          "maxLength": 200,
          "example": "Blue Widget",
          "description": "Human-readable item name"
        },
        "description": {
          "type": "string",
          "example": "A high-quality blue widget for industrial use",
          "description": "Optional detailed description of the item"
        },
        "unit": {
          "type": "string",
          "minLength": 1,
          "maxLength": 50,
          "example": "each",
          "description": "Unit of measure (e.g. each, kg, liter, box)"
        },
        "reorderThreshold": {
          "type": "integer",
          "minimum": 0,
          "example": 10,
          "description": "Stock level at or below which a reorder should be triggered"
        },
        "status": {
          "type": "string",
          "enum": [
            "active",
            "discontinued"
          ],
          "example": "active",
          "description": "Lifecycle status of the item"
        }
      },
      "required": [
        "sku",
        "name",
        "unit"
      ]
    }
settings: {}
examples: ./.resources/Create a new item.resources/examples
order: 2000
