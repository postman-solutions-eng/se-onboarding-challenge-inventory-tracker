$kind: collection
description: |-
  An ordered end-to-end scenario that walks through the full inventory lifecycle from setup to cleanup. Run this folder as a collection run to validate that all core workflows integrate correctly.

  | Step | Request | What it validates |
  |---|---|---|
  | 01 | Create location | A new warehouse location is created and its ID is saved |
  | 02 | Create item | A new inventory item is created and its ID is saved |
  | 03 | Receive 100 units | Stock is received at the location; balance becomes 100 |
  | 04 | Check stock = 100 | Confirms the stock level after receiving |
  | 05 | Issue 30 units | Stock is issued from the location; balance becomes 70 |
  | 06 | Check stock = 70 | Confirms the stock level after issuing |
  | 07 | List movements by itemId | Movement history for the item is returned and not empty |
  | 08 | Delete item (cleanup) | Item is deleted, leaving the environment clean for the next run |

  **Prerequisites:** `{{baseUrl}}` and `{{apiKey}}` must be set in the active environment. The `sku` and `locationCode` collection variables are auto-generated by the collection pre-request script — no manual setup is needed.
order: 5000
