$kind: http-request
name: '07 – List movements filtered by itemId'
order: 7000
url: '{{baseUrl}}/stock-movements?itemId={{itemId}}&page=1&pageSize=20'
method: GET
headers:
  'x-api-key': '{{apiKey}}'
  Accept: application/json
queryParams:
  - key: itemId
    value: '{{itemId}}'
  - key: page
    value: '1'
  - key: pageSize
    value: '20'
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      if (!pm.collectionVariables.get('itemId') || !pm.collectionVariables.get('locationId')) {
          pm.execution.setNextRequest(null);
          throw new Error('Fail-fast: itemId or locationId is missing.');
      }
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 200', () => {
          pm.response.to.have.status(200);
      });
      pm.test('Content-Type is application/json', () => {
          pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json');
      });
      pm.test('Response time is under 1000ms', () => {
          pm.expect(pm.response.responseTime).to.be.below(1000);
      });
      pm.test('Response body matches StockMovementList schema', () => {
          pm.response.to.have.jsonSchema({
              type: 'object',
              required: ['data', 'pagination'],
              properties: {
                  data: {
                      type: 'array',
                      items: {
                          type: 'object',
                          required: ['id', 'type', 'itemId', 'locationId', 'quantity'],
                          properties: {
                              id: { type: 'string' },
                              type: { type: 'string', enum: ['receive', 'issue', 'adjust'] },
                              itemId: { type: 'string' },
                              locationId: { type: 'string' },
                              quantity: { type: 'number' }
                          }
                      }
                  },
                  pagination: {
                      type: 'object',
                      required: ['page', 'pageSize', 'total']
                  }
              }
          });
      });
      pm.test('List contains receiveMovementId', () => {
          const receiveId = pm.collectionVariables.get('receiveMovementId');
          const ids = pm.response.json().data.map(m => m.id);
          pm.expect(ids, 'receiveMovementId must be in results').to.include(receiveId);
      });
      pm.test('List contains issueMovementId', () => {
          const issueId = pm.collectionVariables.get('issueMovementId');
          const ids = pm.response.json().data.map(m => m.id);
          pm.expect(ids, 'issueMovementId must be in results').to.include(issueId);
      });
settings: {}
