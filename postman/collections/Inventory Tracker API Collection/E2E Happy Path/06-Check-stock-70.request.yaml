$kind: http-request
name: '06 – Check stock (expect 70)'
order: 6000
url: '{{baseUrl}}/items/:itemId/stock'
method: GET
headers:
  'x-api-key': '{{apiKey}}'
  Accept: application/json
pathVariables:
  - key: itemId
    value: '{{itemId}}'
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      if (!pm.collectionVariables.get('itemId') || !pm.collectionVariables.get('locationId')) {
          pm.execution.setNextRequest(null);
          throw new Error('Fail-fast: itemId or locationId is missing.');
      }
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 200', () => {
          pm.response.to.have.status(200);
      });
      pm.test('Content-Type is application/json', () => {
          pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json');
      });
      pm.test('Response time is under 1000ms', () => {
          pm.expect(pm.response.responseTime).to.be.below(1000);
      });
      pm.test('Response body matches StockList schema', () => {
          pm.response.to.have.jsonSchema({
              type: 'object',
              required: ['data', 'pagination'],
              properties: {
                  data: {
                      type: 'array',
                      items: {
                          type: 'object',
                          required: ['itemId', 'locationId', 'quantity'],
                          properties: {
                              itemId: { type: 'string' },
                              locationId: { type: 'string' },
                              quantity: { type: 'number' }
                          }
                      }
                  },
                  pagination: {
                      type: 'object',
                      required: ['page', 'pageSize', 'total'],
                      properties: {
                          page: { type: 'number' },
                          pageSize: { type: 'number' },
                          total: { type: 'number' }
                      }
                  }
              }
          });
      });
      pm.test('Stock quantity for locationId equals 70', () => {
          const locationId = pm.collectionVariables.get('locationId');
          const data = pm.response.json().data;
          const entry = data.find(d => d.locationId === locationId);
          pm.expect(entry, 'Stock entry for locationId must exist').to.not.be.undefined;
          pm.expect(entry.quantity).to.equal(70);
      });
settings: {}
