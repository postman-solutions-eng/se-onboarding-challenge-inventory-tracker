$kind: http-request
name: '01 – Create location'
order: 1000
url: '{{baseUrl}}/locations'
method: POST
headers:
  'x-api-key': '{{apiKey}}'
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "code": "{{locationCode}}",
      "name": "E2E Test Warehouse"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 201', () => {
          pm.response.to.have.status(201);
      });
      pm.test('Content-Type is application/json', () => {
          pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json');
      });
      pm.test('Response time is under 1000ms', () => {
          pm.expect(pm.response.responseTime).to.be.below(1000);
      });
      pm.test('Response body matches Location schema', () => {
          pm.response.to.have.jsonSchema({
              type: 'object',
              required: ['id', 'code', 'name'],
              properties: {
                  id: { type: 'string' },
                  code: { type: 'string' },
                  name: { type: 'string' }
              }
          });
      });
      pm.test('locationId is present and saved', () => {
          const json = pm.response.json();
          pm.expect(json, 'Response must contain id').to.have.property('id');
          pm.expect(json.id, 'id must be a non-empty string').to.be.a('string').and.not.empty;
          pm.collectionVariables.set('locationId', json.id);
      });
settings: {}
