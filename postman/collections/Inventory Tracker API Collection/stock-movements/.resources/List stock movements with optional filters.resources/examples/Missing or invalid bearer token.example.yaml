$kind: http-example
request:
  url: "{{baseUrl}}/stock-movements?page=1&pageSize=20&itemId=a1b2c3d4-e5f6-7890-abcd-ef1234567890&locationId=b2c3d4e5-f6a7-8901-bcde-f12345678901&type=receive&dateFrom=2025-01-01T00:00:00Z&dateTo=2025-12-31T23:59:59Z"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    - key: page
      value: "1"
      disabled: false
      description: Page number for pagination (1-based)
    - key: pageSize
      value: "20"
      disabled: false
      description: Number of results per page
    - key: itemId
      value: a1b2c3d4-e5f6-7890-abcd-ef1234567890
      disabled: false
      description: Filter movements by item ID (UUID)
    - key: locationId
      value: b2c3d4e5-f6a7-8901-bcde-f12345678901
      disabled: false
      description: Filter movements by location ID (UUID)
    - key: type
      value: receive
      disabled: false
      description: Filter movements by movement type
    - key: dateFrom
      value: 2025-01-01T00:00:00Z
      disabled: false
      description: Return movements recorded at or after this ISO 8601 date-time
    - key: dateTo
      value: 2025-12-31T23:59:59Z
      disabled: false
      description: Return movements recorded at or before this ISO 8601 date-time
  body:
    type: text
    content: ""
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "code": "UNAUTHORIZED",
        "message": "Authorization header is required",
        "details": []
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "code": {
            "type": "string",
            "example": "VALIDATION_ERROR",
            "description": "Machine-readable error code"
          },
          "message": {
            "type": "string",
            "example": "Request body contains invalid data",
            "description": "Human-readable description of the error"
          },
          "details": {
            "type": "array",
            "description": "Optional list of field-level error details",
            "items": {
              "type": "object",
              "properties": {
                "field": {
                  "type": "string",
                  "example": "sku",
                  "description": "The field or path that caused the error"
                },
                "issue": {
                  "type": "string",
                  "example": "required field is missing",
                  "description": "Description of the specific validation failure"
                }
              }
            }
          }
        },
        "required": [
          "code",
          "message"
        ]
      }
order: 2000
