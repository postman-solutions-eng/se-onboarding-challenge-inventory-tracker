$kind: http-example
request:
  url: "{{baseUrl}}/stock-movements?page=1&pageSize=20&itemId=a1b2c3d4-e5f6-7890-abcd-ef1234567890&locationId=b2c3d4e5-f6a7-8901-bcde-f12345678901&type=receive&dateFrom=2025-01-01T00:00:00Z&dateTo=2025-12-31T23:59:59Z"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    - key: page
      value: "1"
      disabled: false
      description: Page number for pagination (1-based)
    - key: pageSize
      value: "20"
      disabled: false
      description: Number of results per page
    - key: itemId
      value: a1b2c3d4-e5f6-7890-abcd-ef1234567890
      disabled: false
      description: Filter movements by item ID (UUID)
    - key: locationId
      value: b2c3d4e5-f6a7-8901-bcde-f12345678901
      disabled: false
      description: Filter movements by location ID (UUID)
    - key: type
      value: receive
      disabled: false
      description: Filter movements by movement type
    - key: dateFrom
      value: 2025-01-01T00:00:00Z
      disabled: false
      description: Return movements recorded at or after this ISO 8601 date-time
    - key: dateTo
      value: 2025-12-31T23:59:59Z
      disabled: false
      description: Return movements recorded at or before this ISO 8601 date-time
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": [
          {
            "id": "c3d4e5f6-a7b8-9012-cdef-123456789012",
            "type": "receive",
            "itemId": "a1b2c3d4-e5f6-7890-abcd-ef1234567890",
            "locationId": "b2c3d4e5-f6a7-8901-bcde-f12345678901",
            "quantity": 50,
            "referenceNumber": "PO-2025-0042",
            "createdAt": "2025-06-15T10:00:00Z"
          },
          {
            "id": "d4e5f6a7-b8c9-0123-def0-234567890123",
            "type": "issue",
            "itemId": "a1b2c3d4-e5f6-7890-abcd-ef1234567890",
            "locationId": "b2c3d4e5-f6a7-8901-bcde-f12345678901",
            "quantity": 10,
            "referenceNumber": "SO-2025-0099",
            "createdAt": "2025-06-15T11:00:00Z"
          },
          {
            "id": "e5f6a7b8-c9d0-1234-ef01-345678901234",
            "type": "adjust",
            "itemId": "a1b2c3d4-e5f6-7890-abcd-ef1234567890",
