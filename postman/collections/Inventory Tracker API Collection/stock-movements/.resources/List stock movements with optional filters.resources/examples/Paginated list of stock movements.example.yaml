            "delta": -3,
            "reason": "Cycle count correction — 3 units found damaged",
            "createdAt": "2025-06-16T08:00:00Z"
          }
        ],
        "pagination": {
          "page": 1,
          "pageSize": 20,
          "total": 3
        }
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "data": {
            "type": "array",
            "items": {
              "type": "object",
              "properties": {
                "type": {
                  "type": "string",
                  "enum": [
                    "receive",
                    "issue",
                    "adjust"
                  ],
                  "example": "receive",
                  "description": "The type of movement recorded"
                },
                "itemId": {
                  "type": "string",
                  "example": "a1b2c3d4-e5f6-7890-abcd-ef1234567890",
                  "format": "uuid"
                },
                "locationId": {
                  "type": "string",
                  "example": "b2c3d4e5-f6a7-8901-bcde-f12345678901",
                  "format": "uuid"
                },
                "quantity": {
                  "type": "integer",
                  "example": 50,
                  "description": "Units moved (present for receive and issue; absent for adjust)"
                },
                "delta": {
                  "type": "integer",
                  "example": -3,
                  "description": "Signed delta (present only for adjust movements)"
                },
                "reason": {
                  "type": "string",
                  "example": "Cycle count correction — 3 units found damaged",
                  "description": "Reason supplied for the adjustment (present only for adjust movements)"
                },
                "referenceNumber": {
                  "type": "string",
                  "example": "PO-2025-0042",
                  "description": "Reference number supplied on creation (receive and issue only)"
                }
              },
              "required": [
                "id",
                "type",
                "itemId",
                "locationId",
                "createdAt"
              ]
            }
          },
          "pagination": {
            "type": "object",
            "properties": {
              "page": {
                "type": "integer",
                "example": 1,
                "description": "Current page number (1-based)"
              },
              "pageSize": {
                "type": "integer",
                "example": 20,
                "description": "Maximum number of results per page"
              },
              "total": {
                "type": "integer",
                "example": 42,
                "description": "Total number of matching records across all pages"
              }
            },
            "required": [
              "page",
              "pageSize",
              "total"
            ]
          }
        },
        "required": [
          "data",
          "pagination"
        ]
      }
order: 1000
