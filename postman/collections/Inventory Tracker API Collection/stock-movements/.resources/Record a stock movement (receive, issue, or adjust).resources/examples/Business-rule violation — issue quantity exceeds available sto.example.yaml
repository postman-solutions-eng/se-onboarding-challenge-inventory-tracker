$kind: http-example
name: Business-rule violation — issue quantity exceeds available stock
request:
  url: "{{baseUrl}}/stock-movements"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "type": "issue",
        "itemId": "a1b2c3d4-e5f6-7890-abcd-ef1234567890",
        "locationId": "b2c3d4e5-f6a7-8901-bcde-f12345678901",
        "quantity": 100
      }
response:
  statusCode: 422
  statusText: Unprocessable Entity (WebDAV) (RFC 4918)
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "code": "INSUFFICIENT_STOCK",
        "message": "Cannot issue 100 units of WIDGET-001 from WH-EAST; only 42 available",
        "details": [
          {
            "field": "quantity",
            "issue": "requested 100, available 42"
          }
        ]
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "code": {
            "type": "string",
            "example": "VALIDATION_ERROR",
            "description": "Machine-readable error code"
          },
          "message": {
            "type": "string",
            "example": "Request body contains invalid data",
            "description": "Human-readable description of the error"
          },
          "details": {
            "type": "array",
            "description": "Optional list of field-level error details",
            "items": {
              "type": "object",
              "properties": {
                "field": {
                  "type": "string",
                  "example": "sku",
                  "description": "The field or path that caused the error"
                },
                "issue": {
                  "type": "string",
                  "example": "required field is missing",
                  "description": "Description of the specific validation failure"
                }
              }
            }
          }
        },
        "required": [
          "code",
          "message"
        ]
      }
order: 8000
