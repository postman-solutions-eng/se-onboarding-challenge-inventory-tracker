$kind: http-request
description: |-
  Records a stock movement. The `type` discriminator determines the movement variant:
  - **receive** — add stock to a location (positive quantity required)
  - **issue** — remove stock from a location (positive quantity; cannot take stock below zero)
  - **adjust** — apply a signed nonzero delta with a mandatory reason (e.g. cycle count, damage)
url: "{{baseUrl}}/stock-movements"
method: POST
headers:
  'x-api-key': '{{apiKey}}'
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "type": "receive",
      "itemId": "a1b2c3d4-e5f6-7890-abcd-ef1234567890",
      "locationId": "b2c3d4e5-f6a7-8901-bcde-f12345678901",
      "quantity": 50,
      "referenceNumber": "PO-2025-0042"
    }
  $type: |-
    {
      "oneOf": [
        {
          "type": "object",
          "properties": {
            "type": {
              "type": "string",
              "enum": [
                "receive"
              ],
              "description": "Movement type discriminator"
            },
            "itemId": {
              "type": "string",
              "example": "a1b2c3d4-e5f6-7890-abcd-ef1234567890",
              "description": "ID of the item to receive into stock",
              "format": "uuid"
            },
            "locationId": {
              "type": "string",
              "example": "b2c3d4e5-f6a7-8901-bcde-f12345678901",
              "description": "ID of the destination location",
              "format": "uuid"
            },
            "quantity": {
              "type": "integer",
              "minimum": 1,
              "example": 50,
              "description": "Positive integer number of units to add to stock"
            },
            "referenceNumber": {
              "type": "string",
              "example": "PO-2025-0042",
              "description": "Optional purchase order or delivery reference"
            }
          },
          "required": [
            "type",
            "itemId",
            "locationId",
            "quantity"
          ]
        },
        {
          "type": "object",
          "properties": {
            "type": {
              "type": "string",
              "enum": [
                "issue"
              ],
              "description": "Movement type discriminator"
            },
            "itemId": {
              "type": "string",
              "example": "a1b2c3d4-e5f6-7890-abcd-ef1234567890",
              "description": "ID of the item to issue from stock",
              "format": "uuid"
            },
            "locationId": {
              "type": "string",
              "example": "b2c3d4e5-f6a7-8901-bcde-f12345678901",
              "description": "ID of the source location",
              "format": "uuid"
            },
            "quantity": {
              "type": "integer",
              "minimum": 1,
              "example": 10,
              "description": "Positive integer units to remove; must not take stock below zero"
            },
            "referenceNumber": {
              "type": "string",
              "example": "SO-2025-0099",
              "description": "Optional sales order or work order reference"
            }
          },
          "required": [
            "type",
            "itemId",
            "locationId",
            "quantity"
          ]
        },
        {
          "type": "object",
          "properties": {
            "type": {
              "type": "string",
              "enum": [
                "adjust"
              ],
              "description": "Movement type discriminator"
            },
            "itemId": {
              "type": "string",
              "example": "a1b2c3d4-e5f6-7890-abcd-ef1234567890",
              "description": "ID of the item to adjust",
              "format": "uuid"
            },
            "locationId": {
              "type": "string",
              "example": "b2c3d4e5-f6a7-8901-bcde-f12345678901",
              "description": "ID of the location to adjust",
              "format": "uuid"
            },
            "delta": {
              "type": "integer",
              "example": -3,
              "description": "Signed nonzero integer delta: positive increases stock, negative decreases it (must not be 0)"
            },
            "reason": {
              "type": "string",
              "minLength": 1,
              "maxLength": 500,
              "example": "Cycle count correction — 3 units found damaged",
              "description": "Required explanation for the adjustment (e.g. damaged goods, cycle count correction)"
            }
          },
          "required": [
            "type",
            "itemId",
            "locationId",
            "delta",
            "reason"
          ]
        }
      ]
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 201', () => {
          pm.response.to.have.status(201);
      });
      pm.test('Content-Type is application/json', () => {
          pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json');
      });
      pm.test('Response time is under 1000ms', () => {
          pm.expect(pm.response.responseTime).to.be.below(1000);
      });
      pm.test('Response body matches StockMovementResponse schema', () => {
          pm.response.to.have.jsonSchema({
              type: 'object',
              required: ['id', 'type', 'itemId', 'locationId', 'quantity'],
              properties: {
                  id: { type: 'string' },
                  type: { type: 'string', enum: ['receive', 'issue', 'adjust'] },
                  itemId: { type: 'string' },
                  locationId: { type: 'string' },
                  quantity: { type: 'number' },
                  referenceNumber: { type: 'string' },
                  createdAt: { type: 'string' }
              }
          });
      });
settings: {}
examples: ./.resources/Record a stock movement (receive, issue, or adjust).resources/examples
order: 1000
