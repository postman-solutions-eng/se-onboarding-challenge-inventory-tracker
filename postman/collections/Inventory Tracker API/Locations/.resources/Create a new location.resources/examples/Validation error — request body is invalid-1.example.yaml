$kind: http-example
name: Validation error — request body is invalid
request:
  url: "{{baseUrl}}/locations"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "code": "wh east",
        "name": "East Warehouse"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "code": "VALIDATION_ERROR",
        "message": "One or more field values are invalid",
        "details": [
          {
            "field": "code",
            "issue": "must match pattern ^[A-Z0-9][A-Z0-9\\-]{1,19}$"
          }
        ]
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "code": {
            "type": "string",
            "example": "VALIDATION_ERROR",
            "description": "Machine-readable error code"
          },
          "message": {
            "type": "string",
            "example": "Request body contains invalid data",
            "description": "Human-readable description of the error"
          },
          "details": {
            "type": "array",
            "description": "Optional list of field-level error details",
            "items": {
              "type": "object",
              "properties": {
                "field": {
                  "type": "string",
                  "example": "sku",
                  "description": "The field or path that caused the error"
                },
                "issue": {
                  "type": "string",
                  "example": "required field is missing",
                  "description": "Description of the specific validation failure"
                }
              }
            }
          }
        },
        "required": [
          "code",
          "message"
        ]
      }
order: 4000
