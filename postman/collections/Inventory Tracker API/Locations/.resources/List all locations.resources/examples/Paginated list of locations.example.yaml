$kind: http-example
request:
  url: "{{baseUrl}}/locations?page=1&pageSize=20"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    - key: page
      value: "1"
      disabled: false
      description: Page number for pagination (1-based)
    - key: pageSize
      value: "20"
      disabled: false
      description: Number of results per page
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": [
          {
            "id": "b2c3d4e5-f6a7-8901-bcde-f12345678901",
            "code": "WH-EAST",
            "name": "East Warehouse",
            "description": "Main receiving warehouse on the east side of the campus",
            "createdAt": "2025-01-10T08:00:00Z"
          },
          {
            "id": "e5f6a7b8-c9d0-1234-ef01-345678901234",
            "code": "WH-WEST",
            "name": "West Warehouse",
            "description": "Secondary storage facility on the west side",
            "createdAt": "2025-03-05T07:00:00Z"
          }
        ],
        "pagination": {
          "page": 1,
          "pageSize": 20,
          "total": 2
        }
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "data": {
            "type": "array",
            "items": {
              "allOf": [
                {
                  "type": "object",
                  "properties": {
                    "code": {
                      "type": "string",
                      "pattern": "^[A-Z0-9][A-Z0-9\\-]{1,19}$",
                      "example": "WH-EAST",
                      "description": "Short unique location code (uppercase alphanumeric with hyphens, e.g. WH-EAST, BIN-A01)"
                    },
                    "name": {
                      "type": "string",
                      "minLength": 1,
                      "maxLength": 200,
                      "example": "East Warehouse",
                      "description": "Human-readable location name"
                    },
                    "description": {
                      "type": "string",
                      "example": "Main receiving warehouse on the east side of the campus",
                      "description": "Optional address or notes about the location"
                    }
                  },
                  "required": [
                    "code",
                    "name"
                  ]
                },
                {
                  "type": "object",
                  "properties": {
                    "id": {
                      "type": "string",
                      "example": "b2c3d4e5-f6a7-8901-bcde-f12345678901",
                      "description": "Server-generated unique location identifier",
                      "format": "uuid"
                    },
                    "createdAt": {
                      "type": "string",
                      "example": "2025-01-10T08:00:00Z",
                      "description": "ISO 8601 timestamp when the location was created",
                      "format": "date-time"
                    }
                  },
                  "required": [
                    "id",
                    "createdAt"
                  ]
                }
              ]
            }
          },
          "pagination": {
            "type": "object",
            "properties": {
              "page": {
                "type": "integer",
                "example": 1,
                "description": "Current page number (1-based)"
              },
              "pageSize": {
                "type": "integer",
                "example": 20,
                "description": "Maximum number of results per page"
              },
              "total": {
                "type": "integer",
                "example": 42,
                "description": "Total number of matching records across all pages"
              }
            },
            "required": [
              "page",
              "pageSize",
              "total"
            ]
          }
        },
        "required": [
          "data",
          "pagination"
        ]
      }
order: 1000
