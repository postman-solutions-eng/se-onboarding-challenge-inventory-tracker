$kind: http-request
description: Returns full details for a single location.
url: "{{baseUrl}}/locations/:locationId"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: locationId
    value: b2c3d4e5-f6a7-8901-bcde-f12345678901
    disabled: false
    description: Unique identifier of the location (UUID)
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "format": "uuid"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: text
  content: ""
settings: {}
examples: ./.resources/Get a location by ID.resources/examples
order: 3000
