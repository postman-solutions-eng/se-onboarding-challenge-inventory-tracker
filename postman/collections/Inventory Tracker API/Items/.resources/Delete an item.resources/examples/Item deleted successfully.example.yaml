$kind: http-example
request:
  url: "{{baseUrl}}/items/:itemId"
  method: DELETE
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: itemId
      value: a1b2c3d4-e5f6-7890-abcd-ef1234567890
      disabled: false
      description: Unique identifier of the item (UUID)
  body:
    type: text
    content: ""
response:
  statusCode: 204
  statusText: No Content
  body:
    type: text
    content: ""
order: 1000
