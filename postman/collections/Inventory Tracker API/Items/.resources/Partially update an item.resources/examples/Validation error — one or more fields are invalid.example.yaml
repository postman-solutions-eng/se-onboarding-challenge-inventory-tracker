$kind: http-example
request:
  url: "{{baseUrl}}/items/:itemId"
  method: PATCH
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: itemId
      value: a1b2c3d4-e5f6-7890-abcd-ef1234567890
      disabled: false
      description: Unique identifier of the item (UUID)
  body:
    type: json
    content: |-
      {
        "name": ""
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "code": "VALIDATION_ERROR",
        "message": "One or more field values are invalid",
        "details": [
          {
            "field": "name",
            "issue": "must be at least 1 character"
          }
        ]
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "code": {
            "type": "string",
            "example": "VALIDATION_ERROR",
            "description": "Machine-readable error code"
          },
          "message": {
            "type": "string",
            "example": "Request body contains invalid data",
            "description": "Human-readable description of the error"
          },
          "details": {
            "type": "array",
            "description": "Optional list of field-level error details",
            "items": {
              "type": "object",
              "properties": {
                "field": {
                  "type": "string",
                  "example": "sku",
                  "description": "The field or path that caused the error"
                },
                "issue": {
                  "type": "string",
                  "example": "required field is missing",
                  "description": "Description of the specific validation failure"
                }
              }
            }
          }
        },
        "required": [
          "code",
          "message"
        ]
      }
order: 3000
