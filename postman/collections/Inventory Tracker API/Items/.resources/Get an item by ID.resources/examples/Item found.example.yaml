$kind: http-example
request:
  url: "{{baseUrl}}/items/:itemId"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: itemId
      value: a1b2c3d4-e5f6-7890-abcd-ef1234567890
      disabled: false
      description: Unique identifier of the item (UUID)
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": "a1b2c3d4-e5f6-7890-abcd-ef1234567890",
        "sku": "WIDGET-001",
        "name": "Blue Widget",
        "description": "A high-quality blue widget for industrial use",
        "unit": "each",
        "reorderThreshold": 10,
        "status": "active",
        "createdAt": "2025-01-15T09:00:00Z",
        "updatedAt": "2025-06-01T14:30:00Z"
      }
    $type: |-
      {
        "allOf": [
          {
            "type": "object",
            "properties": {
              "sku": {
                "type": "string",
                "pattern": "^[A-Z0-9][A-Z0-9\\-]{2,29}$",
                "example": "WIDGET-001",
                "description": "Stock Keeping Unit — unique product code (uppercase alphanumeric with hyphens, e.g. WIDGET-001)"
              },
              "name": {
                "type": "string",
                "minLength": 1,
                "maxLength": 200,
                "example": "Blue Widget",
                "description": "Human-readable item name"
              },
              "description": {
                "type": "string",
                "example": "A high-quality blue widget for industrial use",
                "description": "Optional detailed description of the item"
              },
              "unit": {
                "type": "string",
                "minLength": 1,
                "maxLength": 50,
                "example": "each",
                "description": "Unit of measure (e.g. each, kg, liter, box)"
              },
              "reorderThreshold": {
                "type": "integer",
                "minimum": 0,
                "example": 10,
                "description": "Stock level at or below which a reorder should be triggered"
              },
              "status": {
                "type": "string",
                "enum": [
                  "active",
                  "discontinued"
                ],
                "example": "active",
                "description": "Lifecycle status of the item"
              }
            },
            "required": [
              "sku",
              "name",
              "unit"
            ]
          },
          {
            "type": "object",
            "properties": {
              "id": {
                "type": "string",
                "example": "a1b2c3d4-e5f6-7890-abcd-ef1234567890",
                "description": "Server-generated unique item identifier",
                "format": "uuid"
              },
              "createdAt": {
                "type": "string",
                "example": "2025-01-15T09:00:00Z",
                "description": "ISO 8601 timestamp when the item was created",
                "format": "date-time"
              },
              "updatedAt": {
                "type": "string",
                "example": "2025-06-01T14:30:00Z",
                "description": "ISO 8601 timestamp when the item was last updated",
                "format": "date-time"
              }
            },
            "required": [
              "id",
              "createdAt",
              "updatedAt"
            ]
          }
        ]
      }
order: 1000
