$kind: http-example
request:
  url: "{{baseUrl}}/items"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "sku": "WIDGET-001",
        "name": "Blue Widget",
        "unit": "each"
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "code": "UNAUTHORIZED",
        "message": "Authorization header is required",
        "details": []
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "code": {
            "type": "string",
            "example": "VALIDATION_ERROR",
            "description": "Machine-readable error code"
          },
          "message": {
            "type": "string",
            "example": "Request body contains invalid data",
            "description": "Human-readable description of the error"
          },
          "details": {
            "type": "array",
            "description": "Optional list of field-level error details",
            "items": {
              "type": "object",
              "properties": {
                "field": {
                  "type": "string",
                  "example": "sku",
                  "description": "The field or path that caused the error"
                },
                "issue": {
                  "type": "string",
                  "example": "required field is missing",
                  "description": "Description of the specific validation failure"
                }
              }
            }
          }
        },
        "required": [
          "code",
          "message"
        ]
      }
order: 5000
