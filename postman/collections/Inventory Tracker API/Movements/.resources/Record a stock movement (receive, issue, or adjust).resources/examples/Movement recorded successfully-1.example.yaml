$kind: http-example
name: Movement recorded successfully
request:
  url: "{{baseUrl}}/stock-movements"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "type": "issue",
        "itemId": "a1b2c3d4-e5f6-7890-abcd-ef1234567890",
        "locationId": "b2c3d4e5-f6a7-8901-bcde-f12345678901",
        "quantity": 10,
        "referenceNumber": "SO-2025-0099"
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": "d4e5f6a7-b8c9-0123-def0-234567890123",
        "type": "issue",
        "itemId": "a1b2c3d4-e5f6-7890-abcd-ef1234567890",
        "locationId": "b2c3d4e5-f6a7-8901-bcde-f12345678901",
        "quantity": 10,
        "referenceNumber": "SO-2025-0099",
        "createdAt": "2025-06-15T11:00:00Z"
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "type": {
            "type": "string",
            "enum": [
              "receive",
              "issue",
              "adjust"
            ],
            "example": "receive",
            "description": "The type of movement recorded"
          },
          "itemId": {
            "type": "string",
            "example": "a1b2c3d4-e5f6-7890-abcd-ef1234567890",
            "format": "uuid"
          },
          "locationId": {
            "type": "string",
            "example": "b2c3d4e5-f6a7-8901-bcde-f12345678901",
            "format": "uuid"
          },
          "quantity": {
            "type": "integer",
            "example": 50,
            "description": "Units moved (present for receive and issue; absent for adjust)"
          },
          "delta": {
            "type": "integer",
            "example": -3,
            "description": "Signed delta (present only for adjust movements)"
          },
          "reason": {
            "type": "string",
            "example": "Cycle count correction — 3 units found damaged",
            "description": "Reason supplied for the adjustment (present only for adjust movements)"
          },
          "referenceNumber": {
            "type": "string",
            "example": "PO-2025-0042",
            "description": "Reference number supplied on creation (receive and issue only)"
          }
        },
        "required": [
          "id",
          "type",
          "itemId",
          "locationId",
          "createdAt"
        ]
      }
order: 2000
