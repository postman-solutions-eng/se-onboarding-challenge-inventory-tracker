openapi: 3.0.3
info:
  title: Inventory Tracker API
  version: '1.0.0'
  description: >
    A simple Inventory Tracker API for managing items, warehouse locations,
    stock levels, and stock movements (receive, issue, adjust).

servers:
  - url: '{baseUrl}'
    variables:
      baseUrl:
        default: 'http://localhost:3000'
        description: Base URL for the Inventory Tracker API

security:
  - bearerAuth: []

tags:
  - name: Items
    description: Manage inventory items — SKU, name, unit, reorder threshold, and lifecycle status.
  - name: Locations
    description: Manage warehouse and bin locations where stock is held.
  - name: Stock
    description: Query current stock levels per item per location.
  - name: Movements
    description: Record and query stock movements (receive, issue, adjust).
  - name: System
    description: System health and operational status.

paths:
  /health:
    get:
      operationId: getHealth
      summary: System health check
      description: Returns the operational status of the service. No authentication required.
      tags:
        - System
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
              examples:
                healthy:
                  summary: Service is up and healthy
                  value:
                    status: ok

  /items:
    get:
      operationId: listItems
      summary: List all items
      description: Returns a paginated list of inventory items with optional filtering by status and name search.
      tags:
        - Items
      parameters:
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/pageSizeParam'
        - name: status
          in: query
          description: Filter items by lifecycle status
          schema:
            type: string
            enum:
              - active
              - discontinued
          example: active
        - name: search
          in: query
          description: Search items by name (case-insensitive substring match)
          schema:
            type: string
          example: widget
      responses:
        '200':
          description: Paginated list of items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemListResponse'
              examples:
                withResults:
                  $ref: '#/components/examples/ItemListWithResults'
                empty:
                  $ref: '#/components/examples/ItemListEmpty'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      operationId: createItem
      summary: Create a new item
      description: Creates a new inventory item. The SKU must be unique across all items.
      tags:
        - Items
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemCreate'
            examples:
              minimal:
                $ref: '#/components/examples/ItemCreateMinimal'
              full:
                $ref: '#/components/examples/ItemCreateFull'
              missingRequiredField:
                summary: 'Body missing sku — triggers 400'
                value:
                  name: Blue Widget
                  unit: each
              invalidSku:
                summary: 'SKU fails pattern — triggers 400'
                value:
                  sku: 'widget 001'
                  name: Blue Widget
                  unit: each
              duplicateSku:
                summary: 'Duplicate SKU already in system — triggers 409'
                value:
                  sku: WIDGET-001
                  name: Blue Widget
                  unit: each
      responses:
        '201':
          description: Item successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
              examples:
                minimal:
                  $ref: '#/components/examples/ItemResponseMinimal'
                full:
                  $ref: '#/components/examples/ItemResponseFull'
        '400':
          description: 'Validation error — request body is invalid'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missingRequiredField:
                  summary: SKU is missing from request body
                  value:
                    code: VALIDATION_ERROR
                    message: Request body is missing required fields
                    details:
                      - field: sku
                        issue: required field is missing
                invalidSku:
                  summary: SKU fails pattern validation
                  value:
                    code: VALIDATION_ERROR
                    message: One or more field values are invalid
                    details:
                      - field: sku
                        issue: 'must match pattern ^[A-Z0-9][A-Z0-9\-]{2,29}$'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: 'Conflict — an item with this SKU already exists'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                duplicateSku:
                  summary: Duplicate SKU
                  value:
                    code: CONFLICT
                    message: An item with SKU WIDGET-001 already exists
                    details:
                      - field: sku
                        issue: SKU must be unique across all items

  /items/{itemId}:
    parameters:
      - $ref: '#/components/parameters/itemIdParam'
    get:
      operationId: getItem
      summary: Get an item by ID
      description: Returns the full details of a single inventory item.
      tags:
        - Items
      responses:
        '200':
          description: Item found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
              examples:
                found:
                  $ref: '#/components/examples/ItemResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      operationId: updateItem
      summary: Partially update an item
      description: Applies a partial update to an existing item. Only provided fields are changed.
      tags:
        - Items
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemUpdate'
            examples:
              nameOnly:
                $ref: '#/components/examples/ItemUpdateNameOnly'
              full:
                $ref: '#/components/examples/ItemUpdateFull'
              emptyName:
                summary: 'Empty name string — triggers 400'
                value:
                  name: ''
              invalidStatus:
                summary: 'Unknown status value — triggers 400'
                value:
                  status: archived
      responses:
        '200':
          description: Item updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
              examples:
                nameOnly:
                  $ref: '#/components/examples/ItemResponseNameOnly'
                full:
                  $ref: '#/components/examples/ItemResponseFull'
        '400':
          description: 'Validation error — one or more fields are invalid'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                emptyName:
                  summary: Name is an empty string (fails minLength)
                  value:
                    code: VALIDATION_ERROR
                    message: One or more field values are invalid
                    details:
                      - field: name
                        issue: must be at least 1 character
                invalidStatus:
                  summary: Status is not a valid enum value
                  value:
                    code: VALIDATION_ERROR
                    message: One or more field values are invalid
                    details:
                      - field: status
                        issue: 'must be one of: active, discontinued'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      operationId: deleteItem
      summary: Delete an item
      description: Permanently removes an item from the inventory catalog.
      tags:
        - Items
      responses:
        '204':
          description: Item deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /locations:
    get:
      operationId: listLocations
      summary: List all locations
      description: Returns a paginated list of all warehouse and bin locations.
      tags:
        - Locations
      parameters:
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/pageSizeParam'
      responses:
        '200':
          description: Paginated list of locations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationListResponse'
              examples:
                withResults:
                  $ref: '#/components/examples/LocationListWithResults'
                empty:
                  $ref: '#/components/examples/LocationListEmpty'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      operationId: createLocation
      summary: Create a new location
      description: Creates a new warehouse or bin location. The location code must be unique.
      tags:
        - Locations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationCreate'
            examples:
              minimal:
                $ref: '#/components/examples/LocationCreateMinimal'
              full:
                $ref: '#/components/examples/LocationCreateFull'
              missingCode:
                summary: 'Body missing code — triggers 400'
                value:
                  name: East Warehouse
              invalidCode:
                summary: 'Code fails pattern — triggers 400'
                value:
                  code: 'wh east'
                  name: East Warehouse
      responses:
        '201':
          description: Location successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
              examples:
                minimal:
                  $ref: '#/components/examples/LocationResponseMinimal'
                full:
                  $ref: '#/components/examples/LocationResponseFull'
        '400':
          description: 'Validation error — request body is invalid'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missingCode:
                  summary: Location code is missing
                  value:
                    code: VALIDATION_ERROR
                    message: Request body is missing required fields
                    details:
                      - field: code
                        issue: required field is missing
                invalidCode:
                  summary: Location code fails pattern validation
                  value:
                    code: VALIDATION_ERROR
                    message: One or more field values are invalid
                    details:
                      - field: code
                        issue: 'must match pattern ^[A-Z0-9][A-Z0-9\-]{1,19}$'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /locations/{locationId}:
    parameters:
      - $ref: '#/components/parameters/locationIdParam'
    get:
      operationId: getLocation
      summary: Get a location by ID
      description: Returns full details for a single location.
      tags:
        - Locations
      responses:
        '200':
          description: Location found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
              examples:
                found:
                  $ref: '#/components/examples/LocationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /items/{itemId}/stock:
    parameters:
      - $ref: '#/components/parameters/itemIdParam'
    get:
      operationId: getItemStockLevels
      summary: Get stock levels for an item across all locations
      description: Returns the current quantity of the specified item at each location where stock is held.
      tags:
        - Stock
      parameters:
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/pageSizeParam'
      responses:
        '200':
          description: Stock levels per location for the specified item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockLevelListResponse'
              examples:
                withStock:
                  $ref: '#/components/examples/StockLevelList'
                empty:
                  $ref: '#/components/examples/StockLevelListEmpty'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /stock-movements:
    post:
      operationId: createStockMovement
      summary: Record a stock movement (receive, issue, or adjust)
      description: |-
        Records a stock movement. The `type` discriminator determines the movement variant:
        - **receive** — add stock to a location (positive quantity required)
        - **issue** — remove stock from a location (positive quantity; cannot take stock below zero)
        - **adjust** — apply a signed nonzero delta with a mandatory reason (e.g. cycle count, damage)
      tags:
        - Movements
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockMovementRequest'
            examples:
              receive:
                $ref: '#/components/examples/StockMovementReceiveRequest'
              issue:
                $ref: '#/components/examples/StockMovementIssueRequest'
              adjust:
                $ref: '#/components/examples/StockMovementAdjustRequest'
              missingRequiredField:
                summary: 'Issue missing itemId — triggers 400'
                value:
                  type: issue
                  locationId: b2c3d4e5-f6a7-8901-bcde-f12345678901
                  quantity: 10
              invalidFieldValue:
                summary: 'Receive with zero quantity — triggers 400'
                value:
                  type: receive
                  itemId: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                  locationId: b2c3d4e5-f6a7-8901-bcde-f12345678901
                  quantity: 0
              itemNotFound:
                summary: 'Non-existent item UUID — triggers 404'
                value:
                  type: receive
                  itemId: f0000000-0000-0000-0000-000000000000
                  locationId: b2c3d4e5-f6a7-8901-bcde-f12345678901
                  quantity: 50
              insufficientStock:
                summary: 'Issue quantity exceeds available stock — triggers 422'
                value:
                  type: issue
                  itemId: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                  locationId: b2c3d4e5-f6a7-8901-bcde-f12345678901
                  quantity: 100
      responses:
        '201':
          description: Movement recorded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockMovementResponse'
              examples:
                receive:
                  $ref: '#/components/examples/StockMovementReceiveResponse'
                issue:
                  $ref: '#/components/examples/StockMovementIssueResponse'
                adjust:
                  $ref: '#/components/examples/StockMovementAdjustResponse'
        '400':
          description: 'Validation error — request body is invalid'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missingRequiredField:
                  summary: Required field is missing
                  value:
                    code: VALIDATION_ERROR
                    message: Request body is missing required fields
                    details:
                      - field: itemId
                        issue: required field is missing
                invalidFieldValue:
                  summary: Quantity must be a positive integer
                  value:
                    code: VALIDATION_ERROR
                    message: One or more field values are invalid
                    details:
                      - field: quantity
                        issue: must be a positive integer (minimum 1)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Item or location not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                itemNotFound:
                  summary: Item not found
                  value:
                    code: NOT_FOUND
                    message: Item f0000000-0000-0000-0000-000000000000 was not found
                    details: []
        '422':
          description: 'Business-rule violation — issue quantity exceeds available stock'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                insufficientStock:
                  summary: Issue quantity exceeds available stock at location
                  value:
                    code: INSUFFICIENT_STOCK
                    message: 'Cannot issue 100 units of WIDGET-001 from WH-EAST; only 42 available'
                    details:
                      - field: quantity
                        issue: 'requested 100, available 42'

    get:
      operationId: listStockMovements
      summary: List stock movements with optional filters
      description: Returns a paginated list of stock movements, optionally filtered by item, location, type, or date range.
      tags:
        - Movements
      parameters:
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/pageSizeParam'
        - name: itemId
          in: query
          description: Filter movements by item ID (UUID)
          schema:
            type: string
            format: uuid
          example: 'a1b2c3d4-e5f6-7890-abcd-ef1234567890'
        - name: locationId
          in: query
          description: Filter movements by location ID (UUID)
          schema:
            type: string
            format: uuid
          example: 'b2c3d4e5-f6a7-8901-bcde-f12345678901'
        - name: type
          in: query
          description: Filter movements by movement type
          schema:
            type: string
            enum:
              - receive
              - issue
              - adjust
          example: receive
        - name: dateFrom
          in: query
          description: 'Return movements recorded at or after this ISO 8601 date-time'
          schema:
            type: string
            format: date-time
          example: '2025-01-01T00:00:00Z'
        - name: dateTo
          in: query
          description: 'Return movements recorded at or before this ISO 8601 date-time'
          schema:
            type: string
            format: date-time
          example: '2025-12-31T23:59:59Z'
      responses:
        '200':
          description: Paginated list of stock movements
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockMovementListResponse'
              examples:
                withResults:
                  $ref: '#/components/examples/StockMovementList'
                empty:
                  $ref: '#/components/examples/StockMovementListEmpty'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT bearer token obtained from your identity provider. Pass in the Authorization header as "Bearer <token>".

  parameters:
    itemIdParam:
      name: itemId
      in: path
      required: true
      description: Unique identifier of the item (UUID)
      schema:
        type: string
        format: uuid
      example: 'a1b2c3d4-e5f6-7890-abcd-ef1234567890'

    locationIdParam:
      name: locationId
      in: path
      required: true
      description: Unique identifier of the location (UUID)
      schema:
        type: string
        format: uuid
      example: 'b2c3d4e5-f6a7-8901-bcde-f12345678901'

    pageParam:
      name: page
      in: query
      description: Page number for pagination (1-based)
      schema:
        type: integer
        minimum: 1
        default: 1
      example: 1

    pageSizeParam:
      name: pageSize
      in: query
      description: Number of results per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      example: 20

  schemas:
    # ── Item ──────────────────────────────────────────────────────────────────
    ItemCreate:
      type: object
      required:
        - sku
        - name
        - unit
      properties:
        sku:
          type: string
          description: 'Stock Keeping Unit — unique product code (uppercase alphanumeric with hyphens, e.g. WIDGET-001)'
          pattern: '^[A-Z0-9][A-Z0-9\-]{2,29}$'
          example: WIDGET-001
        name:
          type: string
          description: Human-readable item name
          minLength: 1
          maxLength: 200
          example: Blue Widget
        description:
          type: string
          description: Optional detailed description of the item
          example: A high-quality blue widget for industrial use
        unit:
          type: string
          description: 'Unit of measure (e.g. each, kg, liter, box)'
          minLength: 1
          maxLength: 50
          example: each
        reorderThreshold:
          type: integer
          description: Stock level at or below which a reorder should be triggered
          minimum: 0
          default: 0
          example: 10
        status:
          type: string
          description: Lifecycle status of the item
          enum:
            - active
            - discontinued
          default: active
          example: active

    ItemUpdate:
      type: object
      description: Fields that can be updated on an existing item. All properties are optional.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          example: Blue Widget Pro
        description:
          type: string
          example: Enhanced blue widget with improved durability
        unit:
          type: string
          minLength: 1
          maxLength: 50
          example: each
        reorderThreshold:
          type: integer
          minimum: 0
          example: 15
        status:
          type: string
          enum:
            - active
            - discontinued
          example: active

    Item:
      allOf:
        - $ref: '#/components/schemas/ItemCreate'
        - type: object
          required:
            - id
            - createdAt
            - updatedAt
          properties:
            id:
              type: string
              format: uuid
              readOnly: true
              description: Server-generated unique item identifier
              example: 'a1b2c3d4-e5f6-7890-abcd-ef1234567890'
            createdAt:
              type: string
              format: date-time
              readOnly: true
              description: ISO 8601 timestamp when the item was created
              example: '2025-01-15T09:00:00Z'
            updatedAt:
              type: string
              format: date-time
              readOnly: true
              description: ISO 8601 timestamp when the item was last updated
              example: '2025-06-01T14:30:00Z'

    # ── Location ──────────────────────────────────────────────────────────────
    LocationCreate:
      type: object
      required:
        - code
        - name
      properties:
        code:
          type: string
          description: 'Short unique location code (uppercase alphanumeric with hyphens, e.g. WH-EAST, BIN-A01)'
          pattern: '^[A-Z0-9][A-Z0-9\-]{1,19}$'
          example: WH-EAST
        name:
          type: string
          description: Human-readable location name
          minLength: 1
          maxLength: 200
          example: East Warehouse
        description:
          type: string
          description: Optional address or notes about the location
          example: Main receiving warehouse on the east side of the campus

    Location:
      allOf:
        - $ref: '#/components/schemas/LocationCreate'
        - type: object
          required:
            - id
            - createdAt
          properties:
            id:
              type: string
              format: uuid
              readOnly: true
              description: Server-generated unique location identifier
              example: 'b2c3d4e5-f6a7-8901-bcde-f12345678901'
            createdAt:
              type: string
              format: date-time
              readOnly: true
              description: ISO 8601 timestamp when the location was created
              example: '2025-01-10T08:00:00Z'

    # ── Stock Level ───────────────────────────────────────────────────────────
    StockLevel:
      type: object
      required:
        - itemId
        - locationId
        - quantity
      properties:
        itemId:
          type: string
          format: uuid
          description: ID of the item
          example: 'a1b2c3d4-e5f6-7890-abcd-ef1234567890'
        locationId:
          type: string
          format: uuid
          description: ID of the location
          example: 'b2c3d4e5-f6a7-8901-bcde-f12345678901'
        locationCode:
          type: string
          description: Short code of the location
          example: WH-EAST
        quantity:
          type: integer
          minimum: 0
          description: Current quantity of the item at this location
          example: 42
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          description: ISO 8601 timestamp of the last stock change at this location
          example: '2025-06-01T14:30:00Z'

    # ── Stock Movement Variants ───────────────────────────────────────────────
    ReceiveMovement:
      type: object
      required:
        - type
        - itemId
        - locationId
        - quantity
      properties:
        type:
          type: string
          enum:
            - receive
          description: Movement type discriminator
        itemId:
          type: string
          format: uuid
          description: ID of the item to receive into stock
          example: 'a1b2c3d4-e5f6-7890-abcd-ef1234567890'
        locationId:
          type: string
          format: uuid
          description: ID of the destination location
          example: 'b2c3d4e5-f6a7-8901-bcde-f12345678901'
        quantity:
          type: integer
          minimum: 1
          description: Positive integer number of units to add to stock
          example: 50
        referenceNumber:
          type: string
          description: Optional purchase order or delivery reference
          example: PO-2025-0042

    IssueMovement:
      type: object
      required:
        - type
        - itemId
        - locationId
        - quantity
      properties:
        type:
          type: string
          enum:
            - issue
          description: Movement type discriminator
        itemId:
          type: string
          format: uuid
          description: ID of the item to issue from stock
          example: 'a1b2c3d4-e5f6-7890-abcd-ef1234567890'
        locationId:
          type: string
          format: uuid
          description: ID of the source location
          example: 'b2c3d4e5-f6a7-8901-bcde-f12345678901'
        quantity:
          type: integer
          minimum: 1
          description: 'Positive integer units to remove; must not take stock below zero'
          example: 10
        referenceNumber:
          type: string
          description: Optional sales order or work order reference
          example: SO-2025-0099

    AdjustMovement:
      type: object
      required:
        - type
        - itemId
        - locationId
        - delta
        - reason
      properties:
        type:
          type: string
          enum:
            - adjust
          description: Movement type discriminator
        itemId:
          type: string
          format: uuid
          description: ID of the item to adjust
          example: 'a1b2c3d4-e5f6-7890-abcd-ef1234567890'
        locationId:
          type: string
          format: uuid
          description: ID of the location to adjust
          example: 'b2c3d4e5-f6a7-8901-bcde-f12345678901'
        delta:
          type: integer
          description: 'Signed nonzero integer delta: positive increases stock, negative decreases it (must not be 0)'
          example: -3
        reason:
          type: string
          description: 'Required explanation for the adjustment (e.g. damaged goods, cycle count correction)'
          minLength: 1
          maxLength: 500
          example: 'Cycle count correction — 3 units found damaged'

    StockMovementRequest:
      oneOf:
        - $ref: '#/components/schemas/ReceiveMovement'
        - $ref: '#/components/schemas/IssueMovement'
        - $ref: '#/components/schemas/AdjustMovement'
      discriminator:
        propertyName: type
        mapping:
          receive: '#/components/schemas/ReceiveMovement'
          issue: '#/components/schemas/IssueMovement'
          adjust: '#/components/schemas/AdjustMovement'

    StockMovementResponse:
      type: object
      required:
        - id
        - type
        - itemId
        - locationId
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Server-generated unique movement identifier
          example: 'c3d4e5f6-a7b8-9012-cdef-123456789012'
        type:
          type: string
          enum:
            - receive
            - issue
            - adjust
          description: The type of movement recorded
          example: receive
        itemId:
          type: string
          format: uuid
          example: 'a1b2c3d4-e5f6-7890-abcd-ef1234567890'
        locationId:
          type: string
          format: uuid
          example: 'b2c3d4e5-f6a7-8901-bcde-f12345678901'
        quantity:
          type: integer
          description: Units moved (present for receive and issue; absent for adjust)
          example: 50
        delta:
          type: integer
          description: Signed delta (present only for adjust movements)
          example: -3
        reason:
          type: string
          description: Reason supplied for the adjustment (present only for adjust movements)
          example: 'Cycle count correction — 3 units found damaged'
        referenceNumber:
          type: string
          description: Reference number supplied on creation (receive and issue only)
          example: PO-2025-0042
        createdAt:
          type: string
          format: date-time
          readOnly: true
          description: ISO 8601 timestamp when the movement was recorded
          example: '2025-06-15T10:00:00Z'

    # ── Shared: Error ─────────────────────────────────────────────────────────
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Machine-readable error code
          example: VALIDATION_ERROR
        message:
          type: string
          description: Human-readable description of the error
          example: Request body contains invalid data
        details:
          type: array
          description: Optional list of field-level error details
          items:
            type: object
            properties:
              field:
                type: string
                description: The field or path that caused the error
                example: sku
              issue:
                type: string
                description: Description of the specific validation failure
                example: required field is missing

    # ── Shared: Pagination + List Wrappers ────────────────────────────────────
    Pagination:
      type: object
      required:
        - page
        - pageSize
        - total
      properties:
        page:
          type: integer
          description: Current page number (1-based)
          example: 1
        pageSize:
          type: integer
          description: Maximum number of results per page
          example: 20
        total:
          type: integer
          description: Total number of matching records across all pages
          example: 42

    ItemListResponse:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Item'
        pagination:
          $ref: '#/components/schemas/Pagination'

    LocationListResponse:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Location'
        pagination:
          $ref: '#/components/schemas/Pagination'

    StockLevelListResponse:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/StockLevel'
        pagination:
          $ref: '#/components/schemas/Pagination'

    StockMovementListResponse:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/StockMovementResponse'
        pagination:
          $ref: '#/components/schemas/Pagination'

  # ── Request Bodies ───────────────────────────────────────────────────────────
  responses:
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            missingToken:
              summary: Authorization header is absent
              value:
                code: UNAUTHORIZED
                message: Authorization header is required
                details: []
            invalidToken:
              summary: Token is expired or invalid
              value:
                code: UNAUTHORIZED
                message: Bearer token is expired or invalid
                details: []

    NotFound:
      description: The requested resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            itemNotFound:
              summary: Item not found
              value:
                code: NOT_FOUND
                message: Item a1b2c3d4-e5f6-7890-abcd-ef1234567890 was not found
                details: []

